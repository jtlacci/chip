# Evaluation policy for this brick. Human-only: a change needs human approval.

# Which paths each loop may change, relative to the brick folder. "*" matches
# across folders. A path in no surface is human-only, and this file,
# data.lock and contract.py are always human-only.
surfaces:
  # app/headers.json is in no surface, so it is human-only: the production
  # server and the evaluation both send it, and only a human changes it.
  implementation: [app/src/**, app/build.js, app/package.json, app/package-lock.json, app/AGENTS.md]
  evaluation: [evaluation/evaluate.py]
code_loop: [implementation]
eval_loop: [evaluation]

# How records are assigned to splits.
#   hash: by a hash of the record ID; "validation" and "holdout" are shares.
#   time: records before the candidate's freeze time are split by time, the
#         last "validation" share becomes validation; records after the freeze
#         are the holdout, so the holdout is always new data.
# Synthetic records always use hash.
split:
  kind: hash
  validation: 0.2
  holdout: 0.2
  min_holdout: 20

# How the runner selects the candidate that gets the holdout run.
selection:
  method: best
  metric: correct

# Seeds for generate() and for any seeded part of an evaluation.
seeds: [1, 2, 3]

# score() receives the live records captured up to this many seconds after each case.
label_horizon_seconds: 0

# A case whose request has no recording is out of evidence: neither a pass nor
# a fail. A trial fails when more than this share of its cases are out of
# evidence, so a candidate cannot skip hard cases.
max_out_of_evidence: 0.05

# Limits on one evaluation run of one split (see the brick-runner README). A
# change cannot raise its own budget: this file is human-only.
budget:
  max_cases: 270
  max_seconds: 720
  max_agent_calls: 400
  max_agent_tokens: 3500000
